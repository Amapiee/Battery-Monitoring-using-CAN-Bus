[platformio]
default_envs = sensor_node, monitor_node

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  milesburton/OneWire @ ^2.3.8
  paulstoffregen/OneWire @ ^2.3.8
  adafruit/Adafruit SSD1306 @ ^2.5.13
  adafruit/Adafruit GFX Library @ ^1.11.11

[env:sensor_node]
extends = env
build_flags = -D NODE_SENSOR

[env:monitor_node]
extends = env
build_flags = -D NODE_MONITOR
